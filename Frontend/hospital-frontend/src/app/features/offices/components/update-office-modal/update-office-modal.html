<div class="modal-overlay" *ngIf="isVisible">
  <div class="modal">
    <h3>✏️ Edit Office</h3>
    
    <div class="form">
      <input 
        [(ngModel)]="editedOffice.address" 
        placeholder="📍 Address" 
        class="form-input">
      
      <input 
        [(ngModel)]="editedOffice.registryPhoneNumber" 
        placeholder="📞 Phone Number" 
        class="form-input">
      
      <select 
        [(ngModel)]="editedOffice.status" 
        class="form-select">
        <option [value]="undefined" disabled>Select status</option>
        <option [value]="officeStatus.Active">Active</option>
        <option [value]="officeStatus.Inactive">Inactive</option>
      </select>

      <div class="buttons">
        <button class="cancel-button" (click)="onCancel()">Cancel</button>
        <button 
          class="submit-button" 
          (click)="onSubmit()">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
