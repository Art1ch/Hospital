<div class="office-card">
  <h1 class="office-address">{{ office.address }}</h1>
  <p class="office-phone">{{ office.registryPhoneNumber }}</p>
  <p class="office-status" [class]="getNameOfStatus(office.status).toLowerCase()">
    {{ getNameOfStatus(office.status) }}
  </p>
  
  <div class="office-actions">
    <button class="btn-edit" (click)="onEdit()" title="Edit office">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
      </svg>
      Edit
    </button>
    <button class="btn-delete" (click)="onDelete()" title="Delete office">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
      </svg>
      Delete
    </button>
  </div>
</div>
