<app-app-header/>
<div class="offices-container">
  <div class="header">
    <h2>📍 Our Offices </h2>
    <button class="create-button" (click)="createModal.open()">
      ➕ Create Office
    </button>
  </div>

  <app-create-office-modal 
    #createModal
    (officeCreated)="onOfficeCreated($event)">
  </app-create-office-modal>

  <app-update-office-modal
    (officeUpdated)="onOfficeUpdated($event)">
  </app-update-office-modal>

  <div *ngIf="isLoading" class="loading">Loading offices</div>

  <div class="offices-grid" *ngIf="!isLoading">
    <app-office-card 
      *ngFor="let office of offices"
      [office]="office"
      (edit)="onOfficeEdit($event)"     
      (delete)="onOfficeDelete($event)">
    </app-office-card>
  </div>

  <app-app-pagination
  [page]="page"
  [pageSize]="pageSize"
  [hasNextPage]="hasNextPage"
  [isLoading]="isLoading"
  (onGoToNext)="goToNextPage()"
  (onGoToPrevious)="goToPreviousPage()"
  (onGoToFirst)="goToFirstPage()">
  </app-app-pagination>

</div>
<app-app-footer/>
