<div class="pagination-element">
  <button 
    class="pagination-button first-button"
    (click)="goToFirst()" 
    [disabled]="!canGoFirst"
    title="First page">
    ⇤
  </button>
  
  <button 
    class="pagination-button" 
    (click)="goToPrevious()" 
    [disabled]="!canGoPrevious">
    ←
  </button>
  
  <span class="page-number">Page {{ page }}</span>
  
  <button 
    class="pagination-button" 
    (click)="goToNext()" 
    [disabled]="!canGoNext">
    →
  </button>
</div>
